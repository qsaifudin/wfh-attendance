name: CI/CD

on:
  push:
    branches: [main]

jobs:
  ci-backend:
    name: Backend — Lint, Test & Build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Unit tests mock PrismaService entirely — nothing here ever connects
      # to a real database — but `prisma generate` still wants the env var
      # present, so this is just a placeholder to satisfy that.
      DATABASE_URL: "mysql://root:root@localhost:3306/wfh_attendance"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build check
        run: npm run build

  ci-frontend:
    name: Frontend — Lint, Test & Build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build check
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: [ci-backend, ci-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            export PATH="/home/sai/.nvm/versions/node/v22.23.2/bin:$PATH"

            cd ~/projects/wfh-attendance
            git pull origin main

            # Backend — NestJS API
            cd backend
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart wfh-attendance-api || pm2 start dist/main.js --name wfh-attendance-api

            # Frontend — Next.js app
            cd ../frontend
            npm ci
            npm run build
            pm2 restart wfh-attendance-web || pm2 start npm --name wfh-attendance-web -- start
